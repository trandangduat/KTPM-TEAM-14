services:
  db:
    image: postgres:16-alpine
    container_name: flash_sale_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: flash_sale_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flash_sale_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: flash_sale_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/flash_sale_db
      - SECRET_KEY=supersecretkeyflashsale2026changethisinproduction
      - API_V1_STR=/api/v1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
